<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cʀɪᴄx 〆 Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.js"></script>

<style>
body{
  margin:0;
  background:#050b18;
  font-family:Arial, sans-serif;
  color:#fff;
}
.header{
  background:#0a1f44;
  padding:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
.sub{font-size:13px;opacity:.8}
.player-box{margin:10px}
.info{
  margin:10px;
  background:#0a1f44;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}
.counter{color:#00ffcc;font-weight:bold}
.tg-box{
  margin:15px;
  padding:15px;
  border-radius:14px;
  background:linear-gradient(135deg,#0a1f44,#020617);
  text-align:center;
}
.tg-box a{
  display:block;
  margin:10px 0;
  padding:13px;
  border-radius:10px;
  background:#0088cc;
  color:#fff;
  font-weight:bold;
  text-decoration:none;
}
</style>
  <style>
/* Telegram Join Popup */
.tg-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
}
.tg-box{
  width:90%;
  max-width:360px;
  background:linear-gradient(135deg,#1da1f2,#0d6efd);
  padding:25px;
  border-radius:16px;
  text-align:center;
  color:#fff;
  box-shadow:0 0 40px rgba(29,161,242,.6);
}
.tg-box h2{
  margin:10px 0;
}
.tg-box p{
  font-size:14px;
  opacity:.9;
}
.tg-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  margin-top:12px;
}
.tg-join{
  background:#fff;
  color:#0d6efd;
  font-weight:bold;
}
.tg-later{
  background:rgba(255,255,255,.25);
  color:#fff;
}
  </style>
</head>

<body oncontextmenu="return false">

<div class="header">
  Cʀɪᴄx 〆 
</div>

<div class="player-box">
  <video 
  id="player"
  playsinline
  muted
  autoplay
  controls
  preload="auto">
  </video>
</div>

<div class="tg-box">
  <a href="https://t.me/CriccSojeeb" target="_blank">
    🔔 Join Telegram for Live Match Links
  </a>
</div>

<script>
// 🔐 Basic Inspect Protection
document.onkeydown = function(e){
  if(e.keyCode==123) return false;
  if(e.ctrlKey && e.shiftKey && e.keyCode==73) return false;
};

// 🔔 Telegram Join Popup (Join / Skip)
if(!localStorage.getItem("tg_skip")){
  setTimeout(()=>{
    if(confirm("Join CriccSojeeb Telegram Channel for live links?")){
      window.location.href="https://t.me/CriccSojeeb";
    }else{
      localStorage.setItem("tg_skip","yes");
    }
  },1500);
}

const CHANNELS = {

  /*
   * Cʀɪᴄx 〆 — 5 × 5 SHORT LINK SYSTEM
   *
   * A1–A5
   * B1–B5
   * C1–C5
   * D1–D5
   * E1–E5
   *
   * Example:
   * https://cricxx.github.io/cricxq-/?A1
   *
   * Replace each placeholder with an authorized stream/embed URL.
   */
  A1: { name:"A1", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  A2: { name:"A2", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  A3: { name:"A3", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  A4: { name:"A4", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  A5: { name:"A5", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  B1: { name:"B1", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  B2: { name:"B2", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  B3: { name:"B3", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  B4: { name:"B4", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  B5: { name:"B5", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  C1: { name:"C1", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  C2: { name:"C2", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  C3: { name:"C3", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  C4: { name:"C4", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  C5: { name:"C5", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  D1: { name:"D1", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  D2: { name:"D2", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  D3: { name:"D3", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  D4: { name:"D4", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  D5: { name:"D5", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  E1: { name:"E1", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  E2: { name:"E2", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  E3: { name:"E3", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  E4: { name:"E4", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },
  E5: { name:"E5", url:"PASTE_AUTHORIZED_STREAM_URL_HERE" },

};


/* ========== STREAM SELECTOR ========== */
const params = new URLSearchParams(window.location.search);

// Short link format: ?A1, ?A2 ... ?E5
// URLSearchParams treats ?A1 as a key with an empty value.
const shortKey = [...params.keys()][0] || "";

if(!/^[A-E][1-5]$/.test(shortKey) || !CHANNELS[shortKey]){
  alert("❌ Invalid or Private Stream Link");
  throw new Error("No stream selected");
}

const source = CHANNELS[shortKey].url;

if(!source || source === "PASTE_AUTHORIZED_STREAM_URL_HERE"){
  alert("⚠️ This stream is not configured yet.");
  throw new Error("Stream URL not configured");
}
const video = document.getElementById("player");

// ▶️ HLS Player
if(Hls.isSupported()){
  const hls = new Hls({autoStartLoad:true});
  hls.loadSource(source);
  hls.attachMedia(video);
}else{
  video.src = source;
}

// 🎛 Plyr UI
new Plyr(video,{
  quality:{
    default:'auto',
    options:['auto',1080,720,480,360],
    forced:true
  }
});

</script>
  <!-- Telegram Join Popup -->
<div class="tg-overlay" id="tgPopup">
  <div class="tg-box">
    <h2>Join our Telegram</h2>
    <p>Get instant updates on all live streams</p>

    <button class="tg-btn tg-join" onclick="joinTG()">Join Now</button>
    <button class="tg-btn tg-later" onclick="closeTG()">Maybe Later</button>
  </div>
</div>
  <script>
function joinTG(){
  window.open("https://t.me/CriccSojeeb","_blank");
}

function closeTG(){
  document.getElementById("tgPopup").style.display="none";
}

// Reload হলেই popup দেখাবে
window.onload = function(){
  document.getElementById("tgPopup").style.display="flex";
};
  </script>

</body>
</html>
