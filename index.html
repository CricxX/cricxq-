<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Cʀɪᴄx 〆 — Live Sports</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#050807;--card:#09100c;--line:rgba(255,255,255,.075);--green:#20e886;--soft:rgba(32,232,134,.07);--text:#f5f7f6;--muted:#7f8b85}
html,body{background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% -15%,rgba(20,190,105,.12),transparent 38%),var(--bg)}
a{text-decoration:none;color:inherit}
.header{height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(4,8,6,.84);backdrop-filter:blur(18px)}
.brand{font-size:30px;line-height:1;font-weight:950;letter-spacing:.2px}
.brand-x{color:var(--green)}
.brand-sub{display:inline-block;margin-left:9px;color:#6f7b75;font-size:9px;font-weight:900;letter-spacing:1.8px;vertical-align:middle}
.live-status{display:flex;align-items:center;gap:8px;color:#d6ddd9;font-size:11px;font-weight:900;letter-spacing:1px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(32,232,134,.08),0 0 14px rgba(32,232,134,.8)}
.page{width:min(1120px,100%);margin:auto;padding:18px 16px 22px}
.player-card{background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.45)}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#030504}
video,iframe{width:100%;height:100%;display:block;border:0}
iframe{display:none}
.player-state{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#030504;text-align:center}
.state-logo{font-size:24px;font-weight:950}.state-logo span{color:var(--green)}
.state-text{margin-top:8px;color:var(--muted);font-size:12px}
.dots:after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}
.error-state{display:none}.error-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,55,55,.08);font-size:25px}
.error-title{margin-top:11px;font-size:18px;font-weight:950}.error-text{margin-top:5px;color:#707b75;font-size:11px}
.info-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:8px;margin-top:8px}
.info-card{border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,rgba(12,20,15,.96),rgba(7,12,9,.96))}
.match-card{padding:17px 18px}
.tournament-card{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{color:var(--green);font-size:10px;font-weight:950;letter-spacing:1.2px;text-transform:uppercase}
.match-title{margin-top:6px;font-size:20px;line-height:1.28;font-weight:900}
.tournament-title{margin-top:3px;font-size:12px;line-height:1.25;font-weight:800;color:#d8dfdb}
.stream-box{margin-top:9px;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
.stream-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stream-heading strong{font-size:12px;font-weight:950}.stream-heading span{color:#5f6b65;font-size:9px}
.streams{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stream-item{min-width:0;min-height:52px;padding:7px 9px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;background:#0b120e;transition:.18s ease}
.stream-item:hover{border-color:rgba(32,232,134,.32)}
.stream-item.active{border-color:var(--green);background:var(--soft)}
.stream-code{flex:0 0 31px;width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#151d18;color:#aab5ae;font-size:10px;font-weight:950}
.active .stream-code{background:var(--green);color:#031008}
.stream-info{min-width:0}.stream-name{font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stream-state{margin-top:2px;color:#64716a;font-size:8px}
.telegram{margin-top:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(22,139,208,.22);border-radius:12px;background:linear-gradient(90deg,rgba(22,139,208,.075),rgba(22,139,208,.025))}
.telegram-left{display:flex;align-items:center;gap:10px;min-width:0}.telegram-icon{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#168bd0;color:#fff;font-size:15px}
.telegram-copy{min-width:0}.telegram-title{font-size:11px;font-weight:900}.telegram-desc{margin-top:3px;color:#728079;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.telegram-btn{flex:0 0 auto;padding:7px 10px;border-radius:8px;background:#168bd0;color:#fff;font-size:9px;font-weight:900}
.footer{padding:14px 0 2px;text-align:center;color:#46524c;font-size:9px;letter-spacing:.4px}
@media(max-width:850px){.info-grid{grid-template-columns:1fr}.streams{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){
.header{height:65px;padding:0 15px}.brand{font-size:24px}.brand-sub{display:none}
.page{padding:10px 9px 18px}.player-card{border-radius:13px}
.info-grid{margin-top:7px;gap:7px}.match-card{padding:14px}.tournament-card{padding:9px 11px}
.match-title{font-size:17px}.tournament-title{font-size:11.5px}
.stream-box{margin-top:9px;padding:11px;border-radius:12px}.streams{grid-template-columns:1fr 1fr;gap:7px}
.stream-item{min-height:48px;padding:7px}.stream-name{font-size:10px}
.telegram{margin-top:8px;padding:9px}.telegram-icon{width:30px;height:30px;flex-basis:30px}.telegram-title{font-size:10px}.telegram-desc{font-size:8px}.telegram-btn{padding:7px 9px;font-size:8px}
}
@media(max-width:370px){.brand{font-size:22px}.stream-name{font-size:9px}.stream-code{width:28px;height:28px;flex-basis:28px}.telegram-desc{display:none}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">Cʀɪᴄ<span class="brand-x">x</span> 〆 <span class="brand-sub">LIVE SPORTS</span></div>
  <div class="live-status"><i class="live-dot"></i> LIVE NOW</div>
</header>

<main class="page">
<section class="player-card">
  <div class="player">
    <video id="video" controls playsinline></video>
    <iframe id="frame" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div class="player-state" id="loading">
      <div class="state-logo">Cʀɪᴄ<span>x</span> 〆</div>
      <div class="state-text">Connecting to stream<span class="dots"></span></div>
    </div>
    <div class="player-state error-state" id="error">
      <div class="error-icon">🔴</div>
      <div class="error-title">Stream Unavailable</div>
      <div class="error-text">This match is currently offline.</div>
    </div>
  </div>
</section>

<section class="info-grid">
  <div class="info-card match-card">
    <div class="label">Match</div>
    <div class="match-title" id="match">—</div>
  </div>
  <div class="info-card tournament-card">
    <div>
      <div class="label">Tournament</div>
      <div class="tournament-title" id="tournament">—</div>
    </div>
  </div>
</section>

<section class="stream-box">
  <div class="stream-heading">
    <strong>Available Streams</strong>
  </div>
  <div class="streams" id="streamList"></div>
</section>

<a class="telegram" href="https://t.me/cricxq" target="_blank" rel="noopener">
  <div class="telegram-left">
    <div class="telegram-icon">➤</div>
    <div class="telegram-copy">
      <div class="telegram-title">Join Cʀɪᴄx 〆 on Telegram</div>
      <div class="telegram-desc">Clips • Ball-by-Ball • Highlights • Cricket Videos • Match Links</div>
    </div>
  </div>
  <div class="telegram-btn">JOIN CHANNEL</div>
</a>

<footer class="footer">© 2026 Cʀɪᴄx 〆 • Live Sports</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
/*
Cʀɪᴄx 〆 STREAM CONFIG

Direct links:
https://cricxx.github.io/cricxq-/?A1
https://cricxx.github.io/cricxq-/?B4

Each group has one Tournament name.
Each stream only needs: name + authorized URL.
*/

const EVENTS = {

  A:{
    tournament:"West Indies Tour of India 2026",
    match:"Match 1",
    streams:{
      A1:{name:"Willow Sports",url:""},
      A2:{name:"Star Sports",url:"http://51.75.127.199:3141/starsports1/index.m3u8"},
      A3:{name:"Tampad",url:""},
      A4:{name:"FanCode",url:""},
      A5:{name:"Fox Sports",url:""}
    }
  },

  B:{
    tournament:"World Championship League of Legends 2026",
    match:"06 - Bangladesh vs England",
    streams:{
      B1:{name:"Star Sports",url:"http://51.75.127.199:3141/starsports2/index.m3u8"},
      B2:{name:"Sony Ten",url:""},
      B3:{name:"Sony LIV",url:""},
      B4:{name:"Willow Sports",url:"https://ntv.cx/embed?t=WElXbjZyTXRVZ3RDRDYyQjhiZjAwb1VhMGQ2a1V5dS9KUWZYdGp6Y1NwVTMrRk40dURzWGFqMUJIRWprQkdzbg~~"},
      B5:{name:"FanCode",url:"https://bd-mc-flive.fancode.com/mumbai/4248563_english_hls_1cd7842cc078552_1ta-di_h264/1080p.m3u8?hdntl=Expires=1791283932~_GO=Generated~acl=/mumbai/4248563_english_hls_1cd7842cc078552_1ta-di_h264/*~Signature=AXZsC1DsseKRi5gDj-Ebt2Mnr-enQaLRtadOkIlFehAPlCJ-hOE5H3lGXfwVpfyhKcYRhxFb4VP2oKDjLz2scDrey3YM"}
    }
  },

  C:{
    tournament:"Sri Lanka tour of Pakistan 2026",
    match:"Match 1",
    streams:{
      C1:{name:"Stream 1",url:""},
      C2:{name:"Stream 2",url:""},
      C3:{name:"Stream 3",url:""},
      C4:{name:"Stream 4",url:""},
      C5:{name:"Stream 5",url:""}
    }
  },

  D:{
    tournament:"Afghanistan vs Bangladesh in UAE 2026",
    match:"Match 1",
    streams:{
      D1:{name:"Stream 1",url:""},
      D2:{name:"Stream 2",url:""},
      D3:{name:"Stream 3",url:""},
      D4:{name:"Stream 4",url:""},
      D5:{name:"Stream 5",url:""}
    }
  },

  E:{
    tournament:"Bangladesh Women tour of Australia 2026",
    match:"Match 1",
    streams:{
      E1:{name:"Stream 1",url:""},
      E2:{name:"Stream 2",url:""},
      E3:{name:"Stream 3",url:""},
      E4:{name:"Stream 4",url:""},
      E5:{name:"Stream 5",url:""}
    }
  }
};

const params=new URLSearchParams(location.search);
const key=([ ...params.keys() ][0]||"").toUpperCase();
const event=EVENTS[key.charAt(0)];
const selected=event?.streams?.[key];

const matchEl=document.getElementById("match");
const tournamentEl=document.getElementById("tournament");
const streamList=document.getElementById("streamList");
const video=document.getElementById("video");
const frame=document.getElementById("frame");
const loading=document.getElementById("loading");
const error=document.getElementById("error");

function showError(){
  loading.style.display="none";
  error.style.display="flex";
}

if(!event||!selected){
  showError();
  matchEl.textContent="Invalid Stream";
  tournamentEl.textContent="Please use a valid Cʀɪᴄx 〆 stream link.";
}else{
  matchEl.textContent=event.match;
  tournamentEl.textContent=event.tournament;
  const entries=Object.entries(event.streams);

  entries.forEach(([streamKey,stream])=>{
    const item=document.createElement("a");
    item.className="stream-item"+(streamKey===key?" active":"");
    item.href=location.origin+location.pathname+"?"+streamKey;
    item.innerHTML=`
      <div class="stream-code">${streamKey}</div>
      <div class="stream-info">
        <div class="stream-name">${stream.name}</div>
        <div class="stream-state">${streamKey===key?"Selected":"Switch stream"}</div>
      </div>`;
    streamList.appendChild(item);
  });

  if(!selected.url){
    showError();
  }else if(/^https?:\/\//i.test(selected.url)){
    if(/\.m3u8($|\?)/i.test(selected.url)){
      if(video.canPlayType("application/vnd.apple.mpegurl")){
        video.src=selected.url;
        video.addEventListener("loadedmetadata",()=>loading.style.display="none",{once:true});
        video.addEventListener("error",showError);
      }else if(window.Hls&&Hls.isSupported()){
        const hls=new Hls();
        hls.loadSource(selected.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED,()=>loading.style.display="none");
        hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)showError()});
      }else showError();
    }else{
      video.style.display="none";
      frame.style.display="block";
      frame.src=selected.url;
      loading.style.display="none";
    }
  }else{
    showError();
  }
}
</script>
</body>
</html>
