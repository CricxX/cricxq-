<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Cʀɪᴄx 〆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#030806;color:#fff;font-family:Arial,Helvetica,sans-serif}
.header{height:68px;display:flex;align-items:center;justify-content:center;background:#040c08;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-size:25px;font-weight:900}.logo span{color:#2af28c}
.page{max-width:1200px;margin:auto;padding:18px}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.09);box-shadow:0 20px 60px rgba(0,0,0,.55)}
.player iframe{width:100%;height:100%;border:0;display:block}
.notice{display:none;min-height:50vh;align-items:center;justify-content:center;text-align:center}
.notice-box{max-width:420px;padding:30px}.notice-icon{font-size:42px;margin-bottom:14px}
.notice h2{font-size:22px;margin-bottom:8px}.notice p{color:#8d9c94;font-size:14px}
.telegram{text-align:center;margin-top:18px}.telegram a{display:inline-block;text-decoration:none;color:#fff;background:#168bd0;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:800}
.footer{text-align:center;color:#53625b;font-size:11px;padding:20px}
@media(max-width:600px){.header{height:62px}.logo{font-size:22px}.page{padding:10px}.player{border-radius:11px}}
</style>
</head>
<body>

<header class="header"><div class="logo">Cʀɪᴄ<span>x</span> 〆</div></header>

<main class="page">
  <div class="player" id="playerBox">
    <iframe id="streamPlayer"
      src=""
      allow="autoplay; fullscreen; encrypted-media; picture-in-picture; gyroscope"
      allowfullscreen></iframe>
  </div>

  <div class="notice" id="notice">
    <div class="notice-box">
      <div class="notice-icon">🔒</div>
      <h2>Invalid Stream Link</h2>
      <p>Please use a valid Cʀɪᴄx 〆 stream link.</p>
    </div>
  </div>

  <div class="telegram">
    <a href="https://t.me/cricxq" target="_blank">✈ Join Telegram</a>
  </div>
</main>

<footer class="footer">© 2026 Cʀɪᴄx 〆</footer>

<script>
/*
====================================================
Cʀɪᴄx 〆 STREAM SETTINGS

Put your authorized EMBED URL in each slot.

Example:
Match1: "https://example.com/embed/abc"

Share:
https://YOUR-SITE.github.io/?match=Match1

The visitor sees ONLY the stream assigned to that
match name. There is no stream list/switcher.
====================================================
*/

const STREAMS = {
  Match1: "PASTE_EMBED_LINK_HERE",
  Match2: "PASTE_EMBED_LINK_HERE",
  Match3: "PASTE_EMBED_LINK_HERE",
  Match4: "PASTE_EMBED_LINK_HERE",
  Match5: "PASTE_EMBED_LINK_HERE",
  Match6: "PASTE_EMBED_LINK_HERE",
  Match7: "PASTE_EMBED_LINK_HERE",
  Match8: "PASTE_EMBED_LINK_HERE",
  Match9: "PASTE_EMBED_LINK_HERE",
  Match10: "PASTE_EMBED_LINK_HERE",
  Match11: "PASTE_EMBED_LINK_HERE",
  Match12: "PASTE_EMBED_LINK_HERE",
  Match13: "PASTE_EMBED_LINK_HERE",
  Match14: "PASTE_EMBED_LINK_HERE",
  Match15: "PASTE_EMBED_LINK_HERE",
  Match16: "PASTE_EMBED_LINK_HERE",
  Match17: "PASTE_EMBED_LINK_HERE",
  Match18: "PASTE_EMBED_LINK_HERE",
  Match19: "PASTE_EMBED_LINK_HERE",
  Match20: "PASTE_EMBED_LINK_HERE"
};

const params = new URLSearchParams(location.search);
const match = params.get("match");
const stream = match ? STREAMS[match] : null;
const playerBox = document.getElementById("playerBox");
const player = document.getElementById("streamPlayer");
const notice = document.getElementById("notice");

if (stream && stream.trim() && stream !== "PASTE_EMBED_LINK_HERE") {
  player.src = stream;
} else {
  playerBox.style.display = "none";
  notice.style.display = "flex";
}
</script>
</body>
</html>
